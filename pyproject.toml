[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchproof"
version = "0.1.0"
description = "Evidence-based website configuration checks and replay"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["typer>=0.12,<1", "httpx>=0.28,<0.29", "httpcore>=1.0.9,<1.1", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
patchproof = "patchproof.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
